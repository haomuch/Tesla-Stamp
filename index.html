                        if (totalDurationMs > 0) fps = Math.round(config.durations.length / (totalDurationMs / 1000));
                        const samples = currentParser.getSamples();
                        const totalVideoBytes = samples.reduce((sum, s) => sum + s.data.length, 0);
                        const durationSec = totalDurationMs / 1000;
                        const originalBitrate = Math.round((totalVideoBytes * 8) / durationSec);
                        // 优化码率策略：高分辨率导出（≤1920 宽）需要充足的码率来保留行车记录仪画面细节（如车牌）
                        // 避免按像素面积等比缩水导致画质下降。我们将导出码率设为原始码率的 80% - 100%（根据降采样比例）
                        // 同时限制码率范围在 6 Mbps 至 15 Mbps 之间
                        const exportW = Math.min(config.width, EXPORT_MAX_WIDTH);
                        const scaleRatio = exportW / config.width;
                        const retentionRatio = scaleRatio < 1.0 ? Math.max(0.8, scaleRatio) : 1.0;
                        const optimalBitrate = Math.round(originalBitrate * retentionRatio);
                        targetBitrate = Math.max(6000000, Math.min(optimalBitrate, 15000000));
                        console.log(`码率计算：原始码率=${(originalBitrate/1000000).toFixed(2)}M, 导出目标码率=${(targetBitrate/1000000).toFixed(2)}M`);
                    }
                } catch (e) { targetBitrate = 6000000; }

                // --- 逻辑优化：重新平衡时间源优先级 ---
                const firstSei = parsedFrames.find(f => f.sei)?.sei;
                const mp4CreationTime = currentParser.getCreationTime();
                let timeBaseSource = "fallback";

                // 1. 优先尝试从 SEI 中提取最精准的各种时间戳
                if (firstSei && firstSei.frameSeqNo) {
                    const seq = Number(firstSei.frameSeqNo);
                    if (seq > 1000000000000) {  // 毫秒级时间戳 (毫秒 > 2001年)
                        videoStartTime = seq;
                        timeBaseSource = "SEI 毫秒级时间戳";
                    } else if (seq > 1000000000) { // 秒级时间戳
                        videoStartTime = seq * 1000;
                        timeBaseSource = "SEI 秒级时间戳";
                    }
                }

                // 2. 如果 SEI 不含有效时间戳，则寻找文件名日期
                if (!videoStartTime && dateMatch) {
                    videoStartTime = new Date(`${dateMatch[1].replace(/-/g, '/')} ${dateMatch[2].replace(/-/g, ':')}`).getTime();
                    timeBaseSource = "文件名日期";
                }

                // 3. 兜底方案：MP4 头部创建时间 -> 文件最后修改时间 -> 当前时间
                if (!videoStartTime) {
                    if (mp4CreationTime) {
                        videoStartTime = mp4CreationTime;
                        timeBaseSource = "MP4 头部创建时间";
                    } else {
                        videoStartTime = originalFileLastModified || Date.now();
                        timeBaseSource = originalFileLastModified ? "文件最后修改时间" : "当前系统时间";
                    }
                }
                console.log(`时间基准确定：${timeBaseSource} (${videoStartTime})`);
                originalMediaDate = Math.floor(videoStartTime / 1000) + MP4_EPOCH_OFFSET;
            } catch (e) {
                console.error("解析遥测数据失败", e);
                parsedFrames = [];
                if (!videoStartTime) videoStartTime = originalFileLastModified || Date.now();
            }

            currentStatusKey = 'statusClickPlay'; currentStatusArg = null; currentStatusIsRec = false;
            updateStatus(t('statusClickPlay'));
            const nextVid = createFreshVideo();
            let isReady = false;
            let dimensionsSet = false;
            let wxBridgeHandler = null;
            // 归位 seek 进行中标记：seek 完成前（onseeked 触发前），阻止任何并发事件提前将 isReady 置为 true
            let isSeeking = false;

            const onReady = () => {
                if (nextVid.readyState < 1 && !nextVid.videoWidth) return;

                // 1. 同步视频尺寸（仅执行一次）
                if (!dimensionsSet && nextVid.videoWidth) {
                    cvs.width = nextVid.videoWidth;
                    cvs.height = nextVid.videoHeight;
                    cachedCanvasWidth = -1;
                    cachedCanvasHeight = -1;
                    dimensionsSet = true;
                }

                if (isReady) return;

                // 2. 归位 seek 进行中（Guard D 触发后），必须等待 onseeked 确认到位才能继续
                // 防止 oncanplay、onprogress、onpause 等并发事件在 seek 未完成时抢先 set isReady
                if (isSeeking) return;

                // 3. 核心逻辑：确保 iOS 自动激活后能够正确回到开头
                // 如果视频正在进行 tryActivate 的激活播放，等待其暂停后再进行就绪判定
                if (!nextVid.paused) return;

                // 4. 针对 iOS 的自动播放导致的进度偏移进行强制回跳
                // 如果当前进度明显偏离开头（如激活时播放了超过 0.1s），则强制归位到 0
                if (nextVid.currentTime > 0.1) {
                    nextVid.pause();    // 先暂停，消除 Guard C 的竞态
                    isSeeking = true;   // 加锁：只有 onseeked 可以解锁，阻断其他并发事件
                    nextVid.currentTime = 0; // seek 到 0，比 0.001 对 iOS keyframe snap 更健壮
                    return; // 等待 onseeked 触发，届时 isSeeking=false 后再次进入 onReady
                }

                // 4. 到这里才认为初始化真正完成
                isReady = true;
                if (wxBridgeHandler) {
                    document.removeEventListener('WeixinJSBridgeReady', wxBridgeHandler);
                    wxBridgeHandler = null;
                }

                startRecBtn.disabled = !checkCapabilities();
                currentStatusKey = 'statusReady'; currentStatusArg = null; currentStatusIsRec = false;
                updateStatus(t('statusReady'));

                // 5. 进行一次初始渲染，展示预览帧
                render();
            };

            // 监听关键事件来触发就绪逻辑
            nextVid.onloadedmetadata = onReady;
            nextVid.oncanplay = onReady;
            nextVid.onprogress = () => { if (nextVid.readyState >= 1 || nextVid.videoWidth) onReady(); };
            nextVid.onplay = () => {
                syncPlayButton(false);
                onReady();
                if (!isRecording) render();
            };
            nextVid.onpause = () => {
                syncPlayButton(true);
                onReady(); // 激活过程中的 pause 会触发此逻辑进行进度归位
            };
            nextVid.onseeked = () => {
                // seek 完成：解锁 isSeeking，使 onReady 得以继续执行就绪判定
                // 注意：isReady=true 之后用户拖动进度条触发的 onseeked 同样走此路径，isSeeking=false 是幂等操作
                isSeeking = false;
                onReady();
                if (nextVid.paused) render();
            };
            nextVid.onended = () => { syncPlayButton(true); animationId = null; };

            // Nudge 逻辑：防止部分浏览器解码管线假死
            const handleStall = () => { if (!nextVid.paused && !isRecording) nextVid.currentTime += 0.005; };
            nextVid.onwaiting = handleStall;
            nextVid.onstalled = handleStall;

            currentVideoUrl = URL.createObjectURL(file);
            nextVid.src = currentVideoUrl;
            vid = nextVid;
            nextVid.load();

            const tryActivate = (doLoad = false) => {
                if (isReady) return;
                try {
                    if (doLoad) nextVid.load();
                    const p = nextVid.play();
                    if (p) {
                        p.then(() => {
                            // 激活成功后立即暂停，这将触发 onpause -> onReady() -> 进度重置
                            nextVid.pause();
                        }).catch(() => {
                            // 如果自动播放被拒绝，只要有基础数据也尝试标记就绪
                            if (nextVid.readyState >= 1 || nextVid.videoWidth) onReady();
                        });
                    }
                } catch (e) { }
            };

            tryActivate();
            if (typeof WeixinJSBridge !== 'undefined') {
                // 适配微信内环境
                WeixinJSBridge.invoke('getNetworkType', {}, () => tryActivate(true));
            }
            wxBridgeHandler = () => tryActivate(true);
            document.addEventListener('WeixinJSBridgeReady', wxBridgeHandler, { once: true });
            fileInput.value = "";
        };

        fileInput.onchange = (e) => handleFile(e.target.files[0]);
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add("active"); };
        dropZone.ondragleave = () => dropZone.classList.remove("active");
        dropZone.ondrop = (e) => { e.preventDefault(); dropZone.classList.remove("active"); handleFile(e.dataTransfer.files[0]); };

        const togglePlay = () => {
            if (!vid || isRecording) return;
            if (vid.paused) {
                const doPlay = () => {
                    vid.play().catch(() => { syncPlayButton(true); });
                    if (animationId === null) animationId = requestAnimationFrame(render);
                };

                // iOS 解码器对齐修复：首次在起始位置附近播放时，先强制 seek 到 0.001 并等待 onseeked，再调用 play()
                // 原理：iOS 视频元素的“呼现位置”（currentTime=0）与内部“解码器位置”可能不同步；
                // tryActivate 激活循环结束后，解码器可能仍缓存在激活播放的断点，
                // 不经此对齐直接调用 play() 会导致 iOS 从解码器缓存位置而非 currentTime 开始播放。
                // 使用 0.001 而非 0：初始化 seek 到了 0，再次 seek to 0 在 iOS 上会被视为 no-op 而不触发 onseeked；
                // 而 0.001 是与 0 不同的位置，能必然触发 onseeked，从而强制解码器对齐。
                if (firstPlayLock && vid.currentTime < 1.0) {
                    firstPlayLock = false;
                    let resolved = false;
                    const resolvePlay = () => {
                        if (resolved) return;
                        resolved = true;
                        vid.removeEventListener('seeked', resolvePlay);
                        doPlay();
                    };
                    vid.addEventListener('seeked', resolvePlay, { once: true });
                    vid.currentTime = 0.001; // 非零点 seek 必然触发 onseeked，强制 iOS 解码器对齐到起始帧
                    // 兆底：极少数情况下 onseeked 不触发（如解码器重置异常），200ms 后强制播放
                    setTimeout(resolvePlay, 200);
                } else {
                    doPlay();
                }
            } else {
                vid.pause();
            }
        };
        cvs.onclick = togglePlay; playPauseBtn.onclick = togglePlay;
        startRecBtn.onclick = startRecording; stopRecBtn.onclick = stopRecording;
        reselectBtn.onclick = () => fileInput.click();
        timeSlider.oninput = () => dragging = true;
        timeSlider.onchange = () => { vid.currentTime = (timeSlider.value / 1000) * vid.duration; dragging = false; render(); };

        window.onload = () => {
            if (!checkCapabilities()) {
                currentStatusKey = 'statusNoSupport'; currentStatusArg = null; currentStatusIsRec = false;
                updateStatus(t('statusNoSupport'));
            }
        };
    </script>
</body>
