<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tesla Dashcam Stamp</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="public/css/style.css">

    <!-- External Libraries -->
    <script src="public/mp4-muxer.min.js"></script>
    <script src="public/protobuf.min.js"></script>

    <!-- Application Modules -->
    <script src="public/js/mp4-parser.js"></script>
    <script src="public/js/i18n.js"></script>
    <script src="public/js/telemetry-renderer.js"></script>
</head>

<body>
    <header class="app-header">
        <h1>Tesla Dashcam Stamp</h1>
        <div class="subtitle" id="appSubtitle">特斯拉行车记录仪水印工具</div>
    </header>

    <main class="main-content">
        <section class="card guide-card">
            <div class="card-header" id="guideHeader">
                <div class="card-title" id="guideTitleText">使用说明</div>
                <div class="toggle-icon" id="toggleIcon">▼</div>
            </div>
            <ul class="guide-steps collapsed" id="guideSteps">
                <li id="guideStep1">导入原始视频文件，自动基于元数据添加水印</li>
                <li id="guideStep2">手机浏览器合成过程中，请勿切换到其他界面</li>
                <li id="guideStep3">所有文件都在客户端处理，不会上传到服务器</li>
            </ul>
        </section>

        <section class="upload-zone" id="dropZone">
            <div class="upload-icon">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z" />
                </svg>
            </div>
            <p id="uploadPrompt">选择原始视频文件</p>
            <input class="inputer" type="file" accept="video/*,.json,application/json" multiple id="fileInput" />
        </section>

        <div class="viewer" id="videoViewer">
            <div class="canvas-container">
                <canvas class="cvs" id="videoCanvas"></canvas>
            </div>

            <div class="controls-overlay">
                <div class="status-bar" style="display: flex; justify-content: space-between; align-items: center;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <div class="status-badge" id="statusBadge">
                            <span class="dot"></span>
                            <span class="text" id="statusText">等待导入视频...</span>
                        </div>
                        <button class="reselect-btn" id="reselectBtn">更换视频</button>
                    </div>
                    <div id="timeDisplay"
                        style="font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; color: var(--text-secondary);">
                        00:00 / 00:00</div>
                </div>

                <div class="timeline-container">
                    <button class="icon-btn" id="playPauseBtn" title="播放/暂停">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                    </button>
                    <div class="slider-container">
                        <input class="timeLine" type="range" min="0" max="1000" step="1" value="0" id="timeSlider" />
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" id="startRecBtn" disabled>
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                            <path
                                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z" />
                            <circle cx="12" cy="12" r="5" />
                        </svg>
                        <span id="startRecBtnText">开始合成</span>
                    </button>
                    <button class="btn btn-secondary" id="stopRecBtn" disabled>
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
                        </svg>
                        <span id="stopRecBtnText">保存视频</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Language Segmented Toggle -->
    <div class="lang-toggle-wrap">
        <div class="lang-switcher" id="langSwitcher">
            <div class="lang-indicator" id="langIndicator"></div>
            <button class="lang-option active" id="langOptZh" data-lang="zh">中文</button>
            <button class="lang-option" id="langOptEn" data-lang="en">English</button>
        </div>
    </div>

    <!-- Main Controller Script -->
    <script src="public/js/app.js"></script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered successfully:', reg.scope))
                    .catch(err => console.warn('Service Worker registration failed:', err));
            });
        }
    </script>
</body>

</html>
